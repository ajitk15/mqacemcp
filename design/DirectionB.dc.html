<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FAF8F5; }
    a { color: #7500C0; } a:hover { color: #A100FF; }
  </style>
</helmet>

<div style="width: 640px; height: 360px; box-sizing: border-box; background: #FAF8F5; color: #1A1A1A; font-family: Archivo, Helvetica, Arial, sans-serif; padding: 30px 34px; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div style="font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: #8A8A8A;">Direction B &mdash; Light editorial</div>
    <div style="font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: #B0AAA4;">sketch</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0;">

    <div style="font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 34px; line-height: 1.1; letter-spacing: -0.015em; color: #171310; max-width: 460px;">
      The estate,<br>on speaking terms.
    </div>

    <div style="width: 44px; height: 2px; background: #A100FF;"></div>

    <div style="display: flex; flex-direction: column; gap: 5px; max-width: 420px;">
      <div style="height: 6px; border-radius: 2px; background: #E2DDD6;"></div>
      <div style="height: 6px; border-radius: 2px; background: #E2DDD6;"></div>
      <div style="height: 6px; width: 62%; border-radius: 2px; background: #E2DDD6;"></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 6px;">
      <div style="display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #DDD7CF; padding-top: 8px;">
        <div style="height: 5px; width: 55%; border-radius: 2px; background: #C9C2B9;"></div>
        <div style="height: 4px; border-radius: 2px; background: #E2DDD6;"></div>
        <div style="height: 4px; width: 78%; border-radius: 2px; background: #E2DDD6;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #DDD7CF; padding-top: 8px;">
        <div style="height: 5px; width: 62%; border-radius: 2px; background: #C9C2B9;"></div>
        <div style="height: 4px; border-radius: 2px; background: #E2DDD6;"></div>
        <div style="height: 4px; width: 70%; border-radius: 2px; background: #E2DDD6;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #DDD7CF; padding-top: 8px;">
        <div style="height: 5px; width: 48%; border-radius: 2px; background: #C9C2B9;"></div>
        <div style="height: 4px; border-radius: 2px; background: #E2DDD6;"></div>
        <div style="height: 4px; width: 84%; border-radius: 2px; background: #E2DDD6;"></div>
      </div>
    </div>

  </div>

  <div style="flex-shrink: 0; font-size: 9.5px; line-height: 1.5; color: #8A8A8A; border-top: 1px solid #E2DDD6; padding-top: 10px;">
    <span style="color: #4A4440; font-weight: 600;">Reads as a considered point of view, not a product ad.</span>
    Safest in a formal client deck &mdash; but it is quiet in a room, and it never shows the chatbot actually working.
  </div>

</div>
</x-dc>
</body>
</html>
